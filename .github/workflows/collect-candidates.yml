name: Collect Paper Candidates

# 토요일 22:00 UTC = 일요일 07:00 KST. 클라우드 루틴(09:00 KST)보다 2시간 앞서
# arXiv/bioRxiv/medRxiv/Europe PMC 후보와 초록을 vault/raw/candidates-YYYY-Www.* 로 저장한다.
# 수동 실행: Actions 탭 → Run workflow → week(YYYY-Www), end(YYYY-MM-DD) 입력(둘 다 선택)
on:
  schedule:
    - cron: '0 22 * * 6'
  workflow_dispatch:
    inputs:
      week:
        description: '주차 (YYYY-Www). 비우면 서울 기준 현재 주.'
        required: false
        default: ''
      end:
        description: '수집 창 마지막 날 (YYYY-MM-DD). 비우면 서울 기준 오늘.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect candidates
        env:
          IN_WEEK: ${{ github.event.inputs.week }}
          IN_END: ${{ github.event.inputs.end }}
        run: |
          WEEK="${IN_WEEK:-$(TZ=Asia/Seoul date +%G-W%V)}"
          echo "WEEK=$WEEK" >> "$GITHUB_ENV"
          ARGS=""
          if [ -n "$IN_END" ]; then ARGS="--end $IN_END"; fi
          python3 scripts/collect_candidates.py "$WEEK" $ARGS

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "vault/raw/candidates-$WEEK.json" "vault/raw/candidates-$WEEK.md"
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git commit -m "paper-radar: $WEEK 후보 수집 (Actions)"
          git push origin HEAD:master || {
            git pull --rebase origin master
            git push origin HEAD:master
          }
